name: Verify live archive status
on:
  push:
    paths:
      - .github/workflows/live-status.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Compare deployed app with new XML archive API (read only)
        env:
          APP_URL: https://political-sample-finder.filip-8d4.workers.dev
        run: |
          python - <<'PY'
          import json, os, urllib.error, urllib.parse, urllib.request
          target=os.environ["APP_URL"].rstrip("/")
          cases={
            "stats":"/api/stats",
            "archive":"/api/archive/status",
            "search":"/api/search?"+urllib.parse.urlencode({"q":"ansvar","page":0,"from":"2024","to":"2026"})
          }
          report={"target":target,"endpoints":{}}
          for name,route in cases.items():
            req=urllib.request.Request(target+route,headers={"Accept":"application/json","User-Agent":"TALEDATABASE-2000-live-check/1.0"})
            try:
              with urllib.request.urlopen(req,timeout=20) as response:
                body=response.read(150_001)
                if len(body)>150000:raise ValueError("Response >150KB")
                data=json.loads(body)
                summary={"http":response.status,"content_type":response.headers.get("content-type")}
                if name=="stats":
                  for k in ["meetings","speeches","verified_audio_meetings","audio_speeches","searchable_first_date","searchable_last_date","xml_meetings","xml_imported_meetings","xml_remaining_meetings","archive_meetings","remaining_meetings","archive_error"]:
                    summary[k]=data.get(k)
                elif name=="archive":
                  summary={k:data.get(k) for k in ["xml_meetings","xml_imported_meetings","xml_remaining_meetings","archive_meetings","indexed_meetings"]}
                  summary["http"]=response.status
                else:
                  summary.update({"results_count":len(data.get("results",[])),"has_more":data.get("has_more"),"limit":data.get("limit"),
                    "results_with_audio":sum(bool(x.get("podcasts")) for x in data.get("results",[])),
                    "result_dates":list(dict.fromkeys(x.get("date") for x in data.get("results",[])))[:4]})
                report["endpoints"][name]=summary
            except urllib.error.HTTPError as exc:report["endpoints"][name]={"http":exc.code,"error":str(exc)}
            except Exception as exc:report["endpoints"][name]={"error":str(exc)}
          # Compare prepared files on GitHub with public Cloudflare assets.
          try:
            with open("public/archive/xml/manifest.json",encoding="utf-8") as source:
              built=json.load(source)
            req=urllib.request.Request(target+"/archive/xml/manifest.json",headers={"Accept":"application/json","User-Agent":"TALEDATABASE-2000-asset-check/1.0"})
            with urllib.request.urlopen(req,timeout=20) as response:
              deployed=json.loads(response.read(200001))
            report["asset_sync"]={
              "github_xml_meetings":len(built),
              "deployed_xml_meetings":len(deployed),
              "missing_from_cloudflare":[x["id"] for x in built if not any(x["id"]==y["id"] and x["version"]==y["version"] for y in deployed)][:12]
            }
          except Exception as exc:
            report["asset_sync"]={"error":str(exc)[:170]}
          # Latest deployed HTML and actual archive year coverage.
          try:
            with urllib.request.urlopen(target+"/",timeout=20) as response:
              homepage=response.read(300000).decode("utf-8","replace")
            report["terminology_live"]={
              "plenary_meetings":"MØDER I SALEN" in homepage,
              "speech_turns":"TALEINDLÆG" in homepage,
              "archive_years":"ARKIVETS ÅR" in homepage,
              "coverage_note":'id="archiveCoverage"' in homepage
            }
          except Exception as exc:
            report["terminology_live"]={"error":str(exc)[:160]}
          report["v04_live"] = (
            isinstance(report["endpoints"].get("stats",{}).get("verified_audio_meetings"),int)
            and "xml_meetings" in report["endpoints"].get("archive",{})
            and report["endpoints"].get("search",{}).get("limit")==25
          )
          print(json.dumps(report,ensure_ascii=False,indent=2))
          with open("live-audio-xml-check.json","w") as out:
            json.dump(report,out,ensure_ascii=False,indent=2)
          PY
      - name: Save live-state report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-archive-readonly-check
          path: live-audio-xml-check.json
          if-no-files-found: warn
