name: Verify live archive status
on:
  push:
    paths:
      - .github/workflows/live-status.yml
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Read public read-only archive counts
        env:
          APP_URL: https://political-sample-finder.filip-8d4.workers.dev
        run: |
          python - <<'PY'
          import urllib.request, json, os
          url=os.environ['APP_URL']+'/api/stats'
          try:
              with urllib.request.urlopen(urllib.request.Request(url,headers={"Accept":"application/json"}),timeout=20) as r:
                  data=json.loads(r.read().decode('utf-8'))
              print(json.dumps({k:data.get(k) for k in ["meetings","speeches","audio_archive_meetings","archive_meetings","indexed_meetings","remaining_meetings","archive_error"]},ensure_ascii=False,indent=2))
          except Exception as exc:
              print("Live app not publicly reachable, possibly Cloudflare Access:",str(exc))
          PY
