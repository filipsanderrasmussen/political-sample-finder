name: Fyld TALEDATABASE 2000

on:
  push:
    branches: [main]
    paths: ['.github/workflows/backfill-archive.yml']
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: taledatabase-archive-backfill
  cancel-in-progress: false

jobs:
  expand-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF reader
        run: python -m pip install 'PyMuPDF==1.26.7'
      - name: Test PDF parsing and source validation
        run: python scripts/test_backfill.py
      - name: Fetch and validate official Folketingstidende referater
        run: python scripts/backfill_archive.py --max-new 12 --max-attempts 36
      - name: Commit verified archive records
        run: |
          git add public/archive/manifest.json public/archive/ scripts/backfill-state.json
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git config user.name 'taledatabase-arkivar[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Arkiv: tilføj verificerede møder fra Folketingstidende'
          git push origin HEAD:main
