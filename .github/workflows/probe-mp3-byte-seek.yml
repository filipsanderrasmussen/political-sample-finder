name: Test MP3 hop til 2 timer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/probe-mp3-byte-seek.py'
      - '.github/workflows/probe-mp3-byte-seek.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Validate script syntax
        run: python -m py_compile scripts/probe-mp3-byte-seek.py
      - name: Seek into source MP3 via HTTP Range; write a 3 second WAV
        run: python -u scripts/probe-mp3-byte-seek.py
      - name: Attach test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mp3-two-hour-range
          path: ft-mp3-two-hour-range.json
          if-no-files-found: warn
