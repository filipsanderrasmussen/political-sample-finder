name: Test XML tale til MP3 og WAV

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/probe-xml-audio-e2e.py'
      - '.github/workflows/probe-xml-audio-e2e.yml'

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Syntax check
        run: python -m py_compile scripts/probe-xml-audio-e2e.py
      - name: Real XML speech to real source MP3 to 3s WAV
        run: python -u scripts/probe-xml-audio-e2e.py
      - name: Upload diagnostic report only, not recorded audio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xml-mp3-wav-e2e
          path: ft-xml-audio-e2e.json
          if-no-files-found: warn
