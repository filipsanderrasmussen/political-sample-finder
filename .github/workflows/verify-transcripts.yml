name: Verify transcript extractor
on:
  push:
    paths:
      - scripts/build_transcript_archive.py
      - .github/workflows/verify-transcripts.yml
  workflow_dispatch:
jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "PyMuPDF>=1.24,<2"
      - run: python scripts/build_transcript_archive.py --meeting 20251_M41
      - name: Show verified extraction and example
        run: |
          python - <<'PY'
          import json
          p=json.load(open("public/archive/20251_M41.json"))
          print("MEETING",p["id"],p["date"],"SPEECHES",len(p["speeches"]))
          for s in p["speeches"][:3]:
            print("EXAMPLE",s["clock"],s["speaker"],s["content"][:150])
          PY
