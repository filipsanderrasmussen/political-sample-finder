name: Refresh official MP3 index
on:
  push:
    paths:
      - scripts/build_audio_index.py
      - .github/workflows/refresh-audio.yml
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read Folketingets official Salen RSS
        run: python scripts/build_audio_index.py
      - name: Commit updated source metadata when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/audio-index.json
          if git diff --staged --quiet; then
            echo "RSS unchanged"
          else
            git commit -m "Refresh official Parliament MP3 links"
            git push
          fi
