name: Test direkte søgning hos Folketinget

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/probe-ft-search.mjs'
      - '.github/workflows/probe-ft-search.yml'

permissions:
  contents: read

jobs:
  check-direct-search:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify script syntax
        run: node --check scripts/probe-ft-search.mjs
      - name: Compare FT positive, negative and known original
        run: node scripts/probe-ft-search.mjs
      - name: Store diagnostic reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ft-search-proof
          path: |
            ft-search-probe.json
            ft-search-probe.md
          if-no-files-found: warn
