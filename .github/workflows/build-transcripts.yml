name: Build two-year transcript archive
on:
  push:
    paths:
      - .github/workflows/build-transcripts.yml
  workflow_dispatch:
  schedule:
    - cron: "43 5 * * 1"
permissions:
  contents: write
concurrency:
  group: parliament-archive
  cancel-in-progress: false
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "PyMuPDF>=1.24,<2"
      - name: Fetch official transcripts for MP3-linked meetings
        run: python -u scripts/build_transcript_archive.py
      - name: Commit verified transcript files
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/archive/
          if git diff --staged --quiet; then
            echo "Nothing new to archive"
          else
            git commit -m "Archive official transcripts for MP3-linked meetings"
            # The source crawl takes time. Other app commits may land meanwhile.
            # Rebase the generated archive on the latest branch before pushing.
            git pull --rebase origin main
            git push origin HEAD:main
          fi
