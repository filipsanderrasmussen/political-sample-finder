name: Tests
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript syntax
        run: |
          node --check src/worker.js
          node --check public/app.js
      - name: Parser regression tests
        run: node --test tests/*.test.mjs
