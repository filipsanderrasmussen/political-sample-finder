name: Inspect official audio feed
on:
  push:
    paths:
      - scripts/inspect_feed.py
      - .github/workflows/inspect-feed.yml
  workflow_dispatch:
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Inspect real RSS metadata
        run: python scripts/inspect_feed.py
